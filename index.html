let artifactApi = null, pending = null;
if (window.claude && claude.use) claude.use("artifact").then(a => { artifactApi = a; }).catch(()=>{});
function flash(msg){ const s = document.getElementById("save"); s.textContent = msg; s.classList.add("show"); clearTimeout(flash.t); flash.t = setTimeout(()=>s.classList.remove("show"), 1400); }
function persist(){
  state.ts = Date.now();
  try { localStorage.setItem("monservice-nov26", JSON.stringify(state)); } catch(e){}
  flash("Enregistré ✓");
  if (!artifactApi) return;
  clearTimeout(pending);
  pending = setTimeout(async () => {
    const json = JSON.stringify(state).replace(/</g, "\\u003c");
    const html = SRC.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/, "$1" + json + "$2");
    try { await artifactApi.publish(html); } catch(e){}
  }, 2500);
}

// ---- Rendu ----
const $ = id => document.getElementById(id);
function visible(it){
  if (it.fixed && !ui.fixed) return false;
  if (ui.filter !== "all" && it.c !== ui.filter && !(it.fixed && ui.fixed)) return false;
  return true;
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pills(it){
  let p = "";
  if (it.w === "c") p += '<span class="pill confirm">à confirmer</span>';
  else if (it.w) p += '<span class="pill deleg">' + esc(it.w) + '</span>';
  if (it.u) p += '<span class="pill mine">ajouté</span>';
  p += '<span class="pill" style="color:' + CATS[it.c].color + '">' + CATS[it.c].short + '</span>';
  return '<div class="meta">' + p + '</div>';
}
function taskHTML(it, withDate){
  const done = !!state.done[it.id];
  const dlabel = withDate ? '<span class="d">' + dayShort(it.d) + '</span>' : "";
  return '<div class="task' + (done ? " done" : "") + '" data-id="' + it.id + '" style="--cc:' + CATS[it.c].color + '">' +
    dlabel + '<span class="box"></span><div class="txt">' + (it.h ? '<b>' + esc(it.h) + '</b> · ' : '') + esc(it.x) + pills(it) + '</div>' + btns(it) + '</div>';
}
function dayShort(d){ const n = +d.slice(3); return DAYNAMES[new Date(2026,10,n).getDay()].slice(0,3) + " " + n; }

function renderChips(){
  const opts = [["all","Tout",null]].concat(["gs","int","lead","pu"].map(k => [k, CATS[k].name, CATS[k].color]));
  $("chips").innerHTML = opts.map(([k,n,c]) =>
    '<button class="chip' + (ui.filter === k ? " on" : "") + '" data-f="' + k + '">' + (c ? '<span class="dot" style="background:' + c + '"></span>' : "") + n + '</button>').join("");
  $("legend").innerHTML = ["gs","int","lead","pu","egl"].map(k => '<span><i class="dot" style="background:' + CATS[k].color + '"></i>' + CATS[k].name + '</span>').join("");
}

function renderWeek(){
  const w = WEEKS[ui.week - 1];
  const tasks = allItems().filter(it => it.k === "t" && +it.d.slice(3) >= w.from && +it.d.slice(3) <= w.to && visible(it));
  const done = tasks.filter(t => state.done[t.id]).length;
  const label = w.from === w.to ? "Lundi 30 novembre" : "Du " + w.from + " au " + w.to + " novembre";
  let out = '<div class="weeknav"><button id="prev"' + (ui.week === 1 ? " disabled" : "") + '>‹</button>' +
    '<div class="wk"><b>Semaine ' + w.n + '</b><small>' + label + ' · ' + done + '/' + tasks.length + ' tâches faites</small>' +
    '<div class="bar"><i style="width:' + (tasks.length ? Math.round(done/tasks.length*100) : 0) + '%"></i></div></div>' +
    '<button id="next"' + (ui.week === 5 ? " disabled" : "") + '>›</button></div>';
  for (let n = w.from; n <= w.to; n++){
    const d = "11-" + String(n).padStart(2,"0");
    const dt = new Date(2026,10,n), wd = dt.getDay();
    const rdv = allItems().filter(it => it.d === d && it.k === "r" && visible(it));
    const tk = allItems().filter(it => it.d === d && it.k === "t" && visible(it));
    out += '<div class="day' + (d === todayD ? " today" : "") + '"><div class="dh"><b>' + DAYNAMES[wd] + ' ' + n + '</b>' +
      (d === todayD ? '<span class="tag">AUJOURD\'HUI</span>' : "") + '</div>';
    const hasFixed = ITEMS.some(it => it.d === d && it.fixed);
    if (!rdv.length && !tk.length) out += '<div class="empty">' + (hasFixed && !ui.fixed ? (wd === 4 ? "Jeûne, pré-culte et culte seulement 🖤" : "PU, MFD, puis l'après-midi en famille 🏡") : "Rien de prévu · temps de repos 🌿") + '</div>';
    if (rdv.length){
      out += '<div class="sec">Rendez-vous</div>';
      rdv.forEach(r => { out += '<div class="rdv' + (r.fixed ? " fixed" : "") + '"><span class="time">' + (r.h || "") + '</span><span class="dot" style="background:' + CATS[r.c].color + '"></span><span style="flex:1">' + esc(r.x) + (r.u ? ' <span class="pill mine">ajouté</span>' : '') + '</span>' + btns(r) + '</div>'; });
    }
    if (tk.length){
      out += '<div class="sec">À faire</div>';
      tk.forEach(t => out += taskHTML(t, false));
    }
    out += '</div>';
  }
  return out;
}

function renderMonth(){
  const all = allItems().filter(it => it.k === "t" && visible(it));
  const mine = all.filter(t => !(t.w && t.w !== "c"));
  const done = mine.filter(t => state.done[t.id]).length;
  const conf = mine.filter(t => t.w === "c" && !state.done[t.id]).length;
  let out = '<div class="stats"><div class="stat"><b>' + done + '/' + mine.length + '</b><span>tâches faites</span></div>' +
    '<div class="stat"><b>' + (mine.length - done) + '</b><span>restantes</span></div>' +
    '<div class="stat"><b style="color:var(--rose)">' + conf + '</b><span>à confirmer</span></div></div>';
  out += '<div class="month">';
  WEEKS.forEach(w => {
    const tk = all.filter(t => +t.d.slice(3) >= w.from && +t.d.slice(3) <= w.to);
    if (!tk.length) return;
    const dn = tk.filter(t => state.done[t.id]).length;
    out += '<div class="week"><h3>Semaine ' + w.n + '<small>' + dn + '/' + tk.length + '</small></h3>';
    tk.forEach(t => out += taskHTML(t, true));
    out += '</div>';
  });
  return out + '</div>';
}

function render(){
  $("tWeek").classList.toggle("on", ui.view === "week");
  $("tMonth").classList.toggle("on", ui.view === "month");
  $("showFixed").checked = ui.fixed;
  renderChips();
  $("app").innerHTML = ui.view === "week" ? renderWeek() : renderMonth();
  saveUI();
}

document.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del){ e.stopPropagation(); askDelete(del.dataset.del, del); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed){ e.stopPropagation(); openForm(ed.dataset.edit); return; }
  const t = e.target.closest(".task");
  if (t){ const id = t.dataset.id; if (state.done[id]) delete state.done[id]; else state.done[id] = true; render(); persist(); return; }
  const f = e.target.closest(".chip");
  if (f){ ui.filter = f.dataset.f; render(); return; }
  if (e.target.id === "prev" && ui.week > 1){ ui.week--; render(); window.scrollTo({top:0}); }
  if (e.target.id === "next" && ui.week < 5){ ui.week++; render(); window.scrollTo({top:0}); }
});
$("tWeek").onclick = () => { ui.view = "week"; render(); };
$("tMonth").onclick = () => { ui.view = "month"; render(); };
$("showFixed").onchange = e => { ui.fixed = e.target.checked; render(); };
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h === "mois") ui.view = "month"; else if (/^semaine-[1-5]$/.test(h)) { ui.view = "week"; ui.week = +h.slice(-1); }
  render();
});
// ---- Ajout manuel ----
let fk = "t", fc = "gs", pendingDel = null, editId = null;
function openForm(id){
  editId = (typeof id === "string") ? id : null;
  $("ferr").textContent = "";
  if (editId){
    const it = findItem(editId); if (!it) return;
    fk = it.k; fc = it.c;
    $("fx").value = it.x; $("fh").value = it.h || ""; $("fd").value = "2026-" + it.d;
    $("fconf").checked = it.w === "c"; $("fw").value = (it.w && it.w !== "c") ? it.w : "";
    $("ftitle").textContent = "Modifier"; $("fok").textContent = "Enregistrer";
  } else {
    fk = "t"; fc = ui.filter !== "all" ? ui.filter : "gs";
    $("fx").value = ""; $("fh").value = ""; $("fw").value = ""; $("fconf").checked = false;
    const w = WEEKS[ui.week - 1];
    let def = w.from;
    if (isNov && today.getDate() >= w.from && today.getDate() <= w.to) def = today.getDate();
    $("fd").value = "2026-11-" + String(def).padStart(2,"0");
    $("ftitle").textContent = "Ajouter"; $("fok").textContent = "Ajouter";
  }
  syncSeg(); $("modal").classList.add("open"); setTimeout(()=>$("fx").focus(), 50);
}
function syncSeg(){
  document.querySelectorAll("#kSeg button").forEach(b => b.classList.toggle("on", b.dataset.k === fk));
  document.querySelectorAll("#cSeg button").forEach(b => b.classList.toggle("on", b.dataset.c === fc));
}
$("fab").onclick = () => openForm();
$("fcancel").onclick = () => $("modal").classList.remove("open");
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("open"); };
$("kSeg").onclick = e => { const b = e.target.closest("button"); if (b){ fk = b.dataset.k; syncSeg(); } };
$("cSeg").onclick = e => { const b = e.target.closest("button"); if (b){ fc = b.dataset.c; syncSeg(); } };
$("fok").onclick = () => {
  const x = $("fx").value.trim(), dv = $("fd").value;
  if (!x){ $("ferr").textContent = "Écris ce que tu veux ajouter."; return; }
  if (!/^2026-11-\d\d$/.test(dv)){ $("ferr").textContent = "Choisis une date en novembre."; return; }
  const d = dv.slice(5), hv = $("fh").value.trim(), wv = $("fw").value.trim();
  const w = $("fconf").checked ? "c" : (wv || "");
  if (editId){
    const patch = {d, k:fk, c:fc, x, h:hv, w};
    const cu = state.custom.find(i => i.id === editId);
    if (cu) Object.assign(cu, patch); else state.edits[editId] = patch;
  } else {
    const it = {id:"u-" + Date.now(), d, k:fk, c:fc, x, u:1};
    if (hv) it.h = hv;
    if (w) it.w = w;
    state.custom.push(it);
  }
  const n = +d.slice(3); WEEKS.forEach(w => { if (n >= w.from && n <= w.to) ui.week = w.n; });
  $("modal").classList.remove("open"); render(); persist();
};
function askDelete(id, btn){
  if (pendingDel === id){
    if (state.custom.some(i => i.id === id)) state.custom = state.custom.filter(i => i.id !== id);
    else state.deleted[id] = true;
    delete state.done[id]; delete state.edits[id]; pendingDel = null; render(); persist(); return;
  }
  pendingDel = id; if (btn) btn.classList.add("arm"); flash("Appuie encore sur ✕ pour supprimer");
  setTimeout(() => { if (pendingDel === id){ pendingDel = null; render(); } }, 3000);
}
render();
</script>
</body>
</html>
